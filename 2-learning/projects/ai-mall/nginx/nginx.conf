# =============================================================================
# AI Mall Nginx 配置文件
# 功能：反向代理到 Spring Cloud Gateway、静态资源服务、gzip 压缩、
#       限流保护、CORS 跨域支持（开发环境）
# 挂载位置：/etc/nginx/nginx.conf
# =============================================================================

# nginx 主进程配置
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# 单进程最大打开文件数
worker_rlimit_nofile 65535;

events {
    # 每个 worker 进程最大并发连接数
    worker_connections 10240;
    # 高效处理策略
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------------
    # 日志格式
    # ---------------------------------------------------------------------------
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '$request_time $upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # ---------------------------------------------------------------------------
    # 基础性能优化
    # ---------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 20m;
    server_tokens   off;

    # ---------------------------------------------------------------------------
    # gzip 压缩配置：减少传输体积，加快页面加载
    # ---------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/xhtml+xml
        application/x-javascript
        application/x-httpd-php
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/x-icon;

    # ---------------------------------------------------------------------------
    # 限流配置：防止恶意请求刷爆后端服务
    # 用法: limit_req zone=api burst=10 nodelay;
    #   - 普通 API:    5 r/s
    #   - 静态资源:   30 r/s（放行常见静态资源）
    #   - 登录接口:    2 r/s（防暴力破解）
    # ---------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=5r/s;
    limit_req_zone  $binary_remote_addr  zone=static:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=2r/s;
    limit_conn_zone $binary_remote_addr  zone=conn_limit:10m;

    # 记录拒请求日志
    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # 上游服务定义 — Spring Cloud Gateway 网关
    # ---------------------------------------------------------------------------
    upstream mall_gateway_backend {
        # 使用 DNS 动态解析容器名，保证网关重启后自动重连
        server mall-gateway:8080  max_fails=3  fail_timeout=30s;
        keepalive 64;
    }

    # 定义默认的 X-Forwarded-For 请求头（防止伪造）
    map $http_x_forwarded_for $client_real_ip {
        default $http_x_forwarded_for;
        ""      $remote_addr;
    }

    # ---------------------------------------------------------------------------
    # 开发环境 CORS 跨域支持（生产环境应配置为具体域名）
    # ---------------------------------------------------------------------------
    map $http_origin $cors_origin {
        default "";
        "~^https?://(localhost|127\.0\.0\.1)(:\d+)?$"   $http_origin;
    }

    # =============================================================================
    # 主服务器配置
    # =============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name  _;

        charset utf-8;
        root  /usr/share/nginx/html;

        # 全局限流
        limit_conn conn_limit 20;
        limit_conn_status 429;

        # -----------------------------------------------------------------------
        # 健康检查接口（给 nginx 自身健康检查用）
        # -----------------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------------------------------------------------
        # 静态资源（图片、字体等），带缓存
        # -----------------------------------------------------------------------
        location ~* \.(png|jpg|jpeg|gif|ico|webp)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            limit_req zone=static burst=50 nodelay;
            try_files $uri =404;
        }

        # -----------------------------------------------------------------------
        # API 反向代理 → Spring Cloud Gateway
        # -----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api burst=10 nodelay;

            # CORS 预检请求直接放行
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin  *;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,token';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }

            # 开发环境 CORS 头（生产环境请移除或改为白名单域名）
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,token' always;
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;
            add_header Access-Control-Allow-Credentials true always;

            proxy_pass http://mall_gateway_backend;

            # 代理请求头
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_real_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    300s;

            # 缓冲区
            proxy_buffering       on;
            proxy_buffer_size     4k;
            proxy_buffers         8 16k;
            proxy_busy_buffers_size 32k;

            # 重写路径：去掉 /api 前缀再转发给网关
            proxy_redirect off;
        }

        # -----------------------------------------------------------------------
        # WebSocket 支持（后续如网关需要 websocket）
        # -----------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://mall_gateway_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_real_ip;
            proxy_read_timeout 3600s;
        }

        # -----------------------------------------------------------------------
        # 登录限流（防暴力破解）
        # -----------------------------------------------------------------------
        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://mall_gateway_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $client_real_ip;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -----------------------------------------------------------------------
        # 前端 SPA 应用（非 /api 请求全部返回 index.html 供 vue-router 使用）
        # -----------------------------------------------------------------------
        location / {
            limit_req zone=static burst=50 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # 静态文件缓存头
        location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 不缓存 index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 错误页面
        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # 隐藏版本信息
        server_tokens off;
    }

    # 可选：HTTPS 配置（生产环境启用，nginx/ssl 目录下放置证书）
    #server {
    #    listen 443 ssl;
    #    http2 on;
    #    server_name _;
    #
    #    ssl_certificate     /etc/nginx/ssl/ai-mall.crt;
    #    ssl_certificate_key /etc/nginx/ssl/ai-mall.key;
    #    ssl_protocols       TLSv1.2 TLSv1.3;
    #    ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #    # 复用 80 端口的 location 配置（生产环境务必去掉开发 CORS 头）
    #    include /etc/nginx/conf.d/*.conf;
    #}
}