# =============================================================================
# AI Mall (AI 智能商城) - Docker Compose 配置文件
# 总览：一站式启动 16 个技术栈组件，覆盖基础设施、Java 后端、Python AI 层和监控
# 执行: docker compose up -d
# 停止: docker compose down
# 查看日志: docker compose logs -f [service-name]
# =============================================================================

version: "3.8"

# =============================================================================
# 网络定义
# mall-infra:   基础设施服务（中间件）内部通信，不暴露给业务层直接访问
# mall-network: 业务服务之间的通信网络
# =============================================================================
networks:
  mall-infra:
    driver: bridge
    name: mall-infra
  mall-network:
    driver: bridge
    name: mall-network

# =============================================================================
# 数据卷定义
# 持久化所有中间件数据，防止容器重启后数据丢失
# =============================================================================
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rocketmq-namesrv-data:
    driver: local
  rocketmq-broker-data:
    driver: local
  rocketmq-broker-logs:
    driver: local
  elasticsearch-data:
    driver: local
  nacos-data:
    driver: local
  nacos-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# =============================================================================
# 服务定义
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # 1. MySQL 8.0 — 关系型数据库，存储所有业务数据
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    hostname: mysql
    restart: unless-stopped
    networks:
      - mall-infra
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mall_root_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_mall}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
      - --default-time-zone=+8:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mall_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 2. Redis 7 — 缓存、分布式锁、会话管理
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: mall-redis
    hostname: redis
    restart: unless-stopped
    networks:
      - mall-infra
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_2024}
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 3. RocketMQ NameServer — 消息队列命名服务
  # ---------------------------------------------------------------------------
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    container_name: mall-rocketmq-namesrv
    hostname: rocketmq-namesrv
    restart: unless-stopped
    networks:
      - mall-infra
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/store
    environment:
      JAVA_OPT_EXT: "-server -Xms256m -Xmx256m"
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tln | grep 9876"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 4. RocketMQ Broker — 消息队列代理，消息存储和转发
  # ---------------------------------------------------------------------------
  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    container_name: mall-rocketmq-broker
    hostname: rocketmq-broker
    restart: unless-stopped
    networks:
      - mall-infra
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m"
      NAMESRV_ADDR: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.2.0/conf/broker.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -tln | grep 10911"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 5. Elasticsearch 8.x — 搜索引擎，商品全文检索
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: mall-elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    networks:
      - mall-infra
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - node.name=elasticsearch
      - cluster.name=ai-mall-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ingest.geoip.downloader.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 6. Nacos 2.x — 服务注册中心与配置中心
  # ---------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mall-nacos
    hostname: nacos
    restart: unless-stopped
    networks:
      - mall-infra
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: ai_mall
      MYSQL_SERVICE_USER: ${MYSQL_USER:-mall_user}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 7. mall-gateway — Spring Cloud Gateway 网关（统一入口，路由转发）
  # ---------------------------------------------------------------------------
  mall-gateway:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_NAME: mall-gateway
        JAR_FILE: mall-gateway/target/mall-gateway.jar
    container_name: mall-gateway
    hostname: mall-gateway
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2024}
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 8. mall-user-service — 用户服务（注册、登录、权限管理）
  # ---------------------------------------------------------------------------
  mall-user-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_NAME: mall-user-service
        JAR_FILE: mall-user-service/target/mall-user-service.jar
    container_name: mall-user-service
    hostname: mall-user-service
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2024}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_mall}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 9. mall-product-service — 商品服务（商品 CRUD、分类、库存管理）
  # ---------------------------------------------------------------------------
  mall-product-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_NAME: mall-product-service
        JAR_FILE: mall-product-service/target/mall-product-service.jar
    container_name: mall-product-service
    hostname: mall-product-service
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2024}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_mall}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
      ES_HOST: ${ES_HOST:-elasticsearch:9200}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 10. mall-order-service — 订单服务（订单创建、状态流转、超时取消）
  # ---------------------------------------------------------------------------
  mall-order-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_NAME: mall-order-service
        JAR_FILE: mall-order-service/target/mall-order-service.jar
    container_name: mall-order-service
    hostname: mall-order-service
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2024}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_mall}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 11. mall-payment-service — 支付服务（支付处理、退款、对账）
  # ---------------------------------------------------------------------------
  mall-payment-service:
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        SERVICE_NAME: mall-payment-service
        JAR_FILE: mall-payment-service/target/mall-payment-service.jar
    container_name: mall-payment-service
    hostname: mall-payment-service
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2024}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_mall}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
    depends_on:
      mysql:
        condition: service_healthy
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 12. ai-search-service — AI 智能搜索服务（FastAPI, LangChain, 语义搜索）
  # ---------------------------------------------------------------------------
  ai-search-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: ai-search-service
    container_name: ai-search-service
    hostname: ai-search-service
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "8085:8085"
    environment:
      SERVICE_NAME: ai-search-service
      ES_HOST: ${ES_HOST:-elasticsearch:9200}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2024}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_mall}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-your-api-key-here}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 13. ai-customer-service — AI 客服服务（FastAPI, RAG 聊天机器人）
  # ---------------------------------------------------------------------------
  ai-customer-service:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        SERVICE_NAME: ai-customer-service
    container_name: ai-customer-service
    hostname: ai-customer-service
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "8086:8086"
    environment:
      SERVICE_NAME: ai-customer-service
      ES_HOST: ${ES_HOST:-elasticsearch:9200}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_2024}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_mall}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_2024}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-your-api-key-here}
      NACOS_SERVER: ${NACOS_SERVER:-nacos:8848}
      ROCKETMQ_NAMESRV: ${ROCKETMQ_NAMESRV:-rocketmq-namesrv:9876}
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 14. Nginx — 反向代理、负载均衡、静态资源服务
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.26-alpine
    container_name: mall-nginx
    hostname: nginx
    restart: unless-stopped
    networks:
      - mall-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/static:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      mall-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 15. Prometheus — 指标采集与监控
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: mall-prometheus
    hostname: prometheus
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      mall-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/ready", "-O", "/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # 16. Grafana — 可视化监控面板
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.3
    container_name: mall-grafana
    hostname: grafana
    restart: unless-stopped
    networks:
      - mall-network
      - mall-infra
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      TZ: Asia/Shanghai
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s