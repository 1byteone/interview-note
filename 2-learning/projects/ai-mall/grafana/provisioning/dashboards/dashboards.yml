# =============================================================================
# Grafana 面板自动配置
# 挂载路径: /etc/grafana/provisioning/dashboards/dashboards.yml
# =============================================================================

apiVersion: 1

providers:
  - name: 'AI Mall Dashboards'
    orgId: 1
    folder: 'AI Mall'
    folderUid: 'ai-mall'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards