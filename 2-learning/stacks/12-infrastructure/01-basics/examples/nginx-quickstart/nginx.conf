# ============================================
# Nginx 完整配置示例
# 功能：反向代理 / 静态文件 / 负载均衡 / SSL / 限流 / Gzip
# 映射到容器: /etc/nginx/conf.d/default.conf
# ============================================

worker_processes auto;                # 与 CPU 核数一致
events {
    worker_connections 1024;          # 单 worker 最大连接数
}

http {
    # 全局 MIME 类型
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;                    # 减少网络包数量
    keepalive_timeout 65;

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_comp_level 5;                # 压缩级别 1-9
    gzip_min_length 1k;               # 小于 1KB 不压缩
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml
               application/xml+rss image/svg+xml;
    gzip_vary on;
    gzip_disable "msie6";

    # ---------- 限流配置 ----------
    # 定义限流区域：每 IP 每秒 10 个请求，突发 20 个
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ---------- 负载均衡：2 个后端实例 ----------
    upstream myapp_backend {
        # least_conn;              # 最少连接算法
        # ip_hash;                 # 会话粘滞（按 IP 哈希）
        server app1:80 weight=3 max_fails=3 fail_timeout=30s;
        server app2:80 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;               # 与上游复用连接
    }

    # ---------- HTTP 服务器（重定向到 HTTPS） ----------
    server {
        listen 80;
        server_name example.com;
        # 全站 HTTPS 跳转
        return 301 https://$host$request_uri;
    }

    # ---------- HTTPS 服务器 ----------
    server {
        listen 443 ssl http2;
        server_name example.com;

        # SSL 证书（由 certbot 或自签证书提供）
        ssl_certificate     /etc/nginx/certs/example.com.crt;
        ssl_certificate_key /etc/nginx/certs/example.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全响应头
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # ---------- 静态文件服务 ----------
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
        }

        # ---------- API 反向代理 + 限流 ----------
        location /api/ {
            # 应用限流规则（超出的返回 503）
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 503;

            proxy_pass http://myapp_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（如需）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # ---------- 健康检查 ----------
        location = /health {
            proxy_pass http://myapp_backend/actuator/health;
            access_log off;
            proxy_connect_timeout 5s;
        }

        # ---------- 根路径（前端 SPA） ----------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;   # SPA 路由回退
        }
    }
}