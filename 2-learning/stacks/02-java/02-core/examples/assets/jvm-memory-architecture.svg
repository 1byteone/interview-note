<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>JVM 内存结构（运行时数据区）</title>
  <desc>JVM Runtime Data Areas: Thread stack, PC Register, Native Method Stack, Heap (Young/Old Gen), Metaspace, and object allocation flow.</desc>
  <defs>
    <marker id="arrowJVM" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/></marker>
    <marker id="arrowJVMGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#16A34A"/></marker>
    <linearGradient id="bgJVM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#12121f"/>
    </linearGradient>
    <linearGradient id="heapGradJVM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="780" rx="18" fill="url(#bgJVM)"/>
  <text x="480" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#FFFFFF">JVM 内存结构（运行时数据区）</text>
  <text x="480" y="82" text-anchor="middle" font-size="14" fill="#94A3B8">线程私有：虚拟机栈 / 程序计数器 / 本地方法栈 · 线程共享：堆 / 方法区（JDK8+ 为元空间）</text>

  <!-- ===== 线程私有区域 ===== -->
  <text x="120" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#94A3B8">线程私有（Thread Private）</text>

  <!-- 虚拟机栈 -->
  <rect x="28" y="145" width="185" height="250" rx="12" fill="#14532D" stroke="#22C55E" stroke-width="2"/>
  <text x="120" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#BBF7D0">线程栈</text>
  <text x="120" y="192" text-anchor="middle" font-size="11" fill="#86EFAC">(虚拟机栈)</text>
  <rect x="45" y="208" width="151" height="30" rx="6" fill="#16A34A"/>
  <text x="120" y="228" text-anchor="middle" font-size="12" fill="#FFFFFF">局部变量表</text>
  <rect x="45" y="247" width="151" height="30" rx="6" fill="#16A34A"/>
  <text x="120" y="267" text-anchor="middle" font-size="12" fill="#FFFFFF">操作数栈</text>
  <rect x="45" y="286" width="151" height="30" rx="6" fill="#16A34A"/>
  <text x="120" y="306" text-anchor="middle" font-size="12" fill="#FFFFFF">动态链接</text>
  <rect x="45" y="325" width="151" height="30" rx="6" fill="#16A34A"/>
  <text x="120" y="345" text-anchor="middle" font-size="12" fill="#FFFFFF">方法返回地址</text>

  <!-- 程序计数器 -->
  <rect x="28" y="415" width="185" height="62" rx="12" fill="#3B0764" stroke="#A855F7" stroke-width="2"/>
  <text x="120" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#E9D5FF">程序计数器</text>
  <text x="120" y="464" text-anchor="middle" font-size="11" fill="#D8B4FE">(PC Register)</text>

  <!-- 本地方法栈 -->
  <rect x="28" y="495" width="185" height="62" rx="12" fill="#7C2D12" stroke="#FB923C" stroke-width="2"/>
  <text x="120" y="522" text-anchor="middle" font-size="16" font-weight="bold" fill="#FED7AA">本地方法栈</text>
  <text x="120" y="544" text-anchor="middle" font-size="11" fill="#FDBA74">(Native Method Stack)</text>

  <!-- 加载流程：Java 字节码 → 类加载器 -->
  <rect x="28" y="585" width="185" height="150" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <text x="120" y="612" text-anchor="middle" font-size="15" font-weight="bold" fill="#E2E8F0">类加载流程</text>
  <rect x="45" y="630" width="151" height="28" rx="6" fill="#334155"/>
  <text x="120" y="649" text-anchor="middle" font-size="11" fill="#CBD5E1">.class 字节码文件</text>
  <path d="M120,658 L120,672" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowJVM)"/>
  <rect x="45" y="675" width="151" height="28" rx="6" fill="#334155"/>
  <text x="120" y="694" text-anchor="middle" font-size="11" fill="#CBD5E1">加载 → 链接 → 初始化</text>
  <path d="M120,703 L120,717" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowJVM)"/>
  <text x="120" y="733" text-anchor="middle" font-size="11" font-weight="bold" fill="#38BDF8">分配到堆中</text>

  <!-- ===== 线程共享区域 ===== -->
  <text x="640" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#94A3B8">线程共享（Thread Shared）</text>

  <!-- 堆 -->
  <rect x="235" y="145" width="450" height="470" rx="14" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="460" y="172" text-anchor="middle" font-size="22" font-weight="bold" fill="#60A5FA">堆（Heap）</text>
  <text x="460" y="193" text-anchor="middle" font-size="11" fill="#93C5FD">所有对象实例与数组 · 新生代 : 老年代 ≈ 1 : 2 · GC 主要发生区域</text>

  <!-- 新生代 -->
  <rect x="255" y="208" width="410" height="246" rx="10" fill="#1E3A8A"/>
  <text x="460" y="232" text-anchor="middle" font-size="16" font-weight="bold" fill="#BFDBFE">新生代（Young Gen）</text>

  <!-- Eden -->
  <rect x="272" y="248" width="245" height="186" rx="8" fill="url(#heapGradJVM)"/>
  <text x="394" y="340" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">Eden</text>
  <text x="394" y="365" text-anchor="middle" font-size="11" fill="#DBEAFE">新对象在此分配</text>
  <text x="394" y="386" text-anchor="middle" font-size="11" fill="#DBEAFE">Minor GC 后存活对象 → S0/S1</text>

  <!-- S0 S1 -->
  <rect x="528" y="248" width="64" height="186" rx="6" fill="#2563EB"/>
  <rect x="600" y="248" width="48" height="186" rx="6" fill="#1D4ED8"/>
  <text x="560" y="345" text-anchor="middle" font-size="13" fill="#FFFFFF">S0</text>
  <text x="624" y="345" text-anchor="middle" font-size="13" fill="#DBEAFE">S1</text>
  <text x="594" y="410" text-anchor="middle" font-size="10" fill="#93C5FD">S0/S1 互换复制分区</text>

  <!-- 老年代 -->
  <rect x="255" y="468" width="410" height="128" rx="10" fill="#172554"/>
  <text x="460" y="495" text-anchor="middle" font-size="16" font-weight="bold" fill="#93C5FD">老年代（Old Gen）</text>
  <text x="460" y="522" text-anchor="middle" font-size="12" fill="#BFDBFE">大对象直接进入 · 长期存活对象晋升至此</text>
  <text x="460" y="546" text-anchor="middle" font-size="12" fill="#BFDBFE">发生 Major GC / Full GC</text>
  <text x="460" y="578" text-anchor="middle" font-size="11" fill="#64748B">堆参数：-Xms 初始 / -Xmx 最大 / -Xmn 新生代</text>

  <!-- 元空间 -->
  <rect x="700" y="145" width="230" height="470" rx="14" fill="#450A0A" stroke="#EF4444" stroke-width="3"/>
  <text x="815" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#FCA5A5">元空间</text>
  <text x="815" y="195" text-anchor="middle" font-size="12" fill="#FECACA">（方法区 · Metaspace）</text>
  <text x="815" y="222" text-anchor="middle" font-size="12" fill="#FECACA" font-weight="bold">存储内容</text>
  <line x1="735" y1="234" x2="895" y2="234" stroke="#7F1D1D" stroke-width="1"/>
  <text x="815" y="258" text-anchor="middle" font-size="13" fill="#FEE2E2">类元信息（Klass）</text>
  <text x="815" y="284" text-anchor="middle" font-size="13" fill="#FEE2E2">常量池（Constant Pool）</text>
  <text x="815" y="310" text-anchor="middle" font-size="13" fill="#FEE2E2">静态变量</text>
  <text x="815" y="336" text-anchor="middle" font-size="13" fill="#FEE2E2">方法字节码</text>
  <text x="815" y="362" text-anchor="middle" font-size="13" fill="#FEE2E2">JIT 编译产物</text>
  <line x1="735" y1="380" x2="895" y2="380" stroke="#7F1D1D" stroke-width="1"/>
  <text x="815" y="404" text-anchor="middle" font-size="11" fill="#F87171">区别 JDK7 以前：</text>
  <text x="815" y="424" text-anchor="middle" font-size="11" fill="#F87171">永久代（方法区实现，在堆中）</text>
  <text x="815" y="444" text-anchor="middle" font-size="11" fill="#F87171">JDK8+：Metaspace 使用本机内存</text>
  <text x="815" y="464" text-anchor="middle" font-size="11" fill="#F87171">参数 -XX:MetaspaceSize / MaxMetaspaceSize</text>
  <text x="815" y="530" text-anchor="middle" font-size="11" fill="#F87171">类对象实例由</text>
  <text x="815" y="550" text-anchor="middle" font-size="11" fill="#F87171">ClassLoader 按需加载</text>
  <text x="815" y="585" text-anchor="middle" font-size="11" fill="#F87171">字符串常量池在堆中</text>

  <!-- ===== 对象分配流程 ===== -->
  <text x="480" y="660" text-anchor="middle" font-size="16" font-weight="bold" fill="#67E8F9">对象分配流程</text>
  <rect x="150" y="680" width="160" height="46" rx="10" fill="#0E7490"/>
  <text x="230" y="708" text-anchor="middle" font-size="13" fill="#CFFAFE">① new 对象</text>
  <path d="M310,703 L380,703" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowJVMGreen)"/>
  <rect x="380" y="680" width="160" height="46" rx="10" fill="#0E7490"/>
  <text x="460" y="700" text-anchor="middle" font-size="13" fill="#CFFAFE">② Eden 分配</text>
  <text x="460" y="717" text-anchor="middle" font-size="11" fill="#A5F3FC">(TLAB 优先)</text>
  <path d="M540,703 L610,703" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrowJVMGreen)"/>
  <rect x="610" y="680" width="190" height="46" rx="10" fill="#0E7490"/>
  <text x="705" y="700" text-anchor="middle" font-size="13" fill="#CFFAFE">③ Minor GC 存活</text>
  <text x="705" y="717" text-anchor="middle" font-size="11" fill="#A5F3FC">复制到 S0/S1（年龄+1）</text>
  <path d="M640,680 L500,626 L340,680" stroke="#22D3EE" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowJVMGreen)"/>
  <text x="520" y="640" text-anchor="middle" font-size="11" fill="#22D3EE">晋升阈值（默认15）</text>
</svg>