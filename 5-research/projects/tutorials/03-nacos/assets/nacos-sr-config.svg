<line x1="120" y1="452" x2="152" y2="452" stroke="#eb6c36" stroke-width="1.2"/><text x="160" y="456" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">焦点</text>
<line x1="220" y1="452" x2="252" y2="452" stroke="#4f5d75" stroke-width="1.2"/><text x="260" y="456" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">普通</text>
