<rect x="160" y="80" width="180" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/><text x="250" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">服务提供者</text><text x="250" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">启动时注册 · 5s心跳</text>
