<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 600" role="img" aria-labelledby="t04-title t04-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t04-title">Spring Cloud Gateway 过滤器链执行流程</title>
<desc id="t04-desc">请求经 Pre Filter 过滤器链鉴权限流改写后路由转发到目标服务，响应再经 Post Filter 返回客户端的完整过滤器链，含 GlobalFilter 与 GatewayFilter 两种过滤器类型。</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');</style>
<marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="440" y1="56" x2="440" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="440" y1="172" x2="440" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="440" y1="268" x2="440" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="440" y1="364" x2="440" y2="404" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="440" y1="480" x2="440" y2="520" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d)"/>
<path d="M 228,130 H 296" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
<path d="M 652,130 H 584" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
<rect x="368" y="16" width="144" height="40" rx="4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
<text x="440" y="32" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">HTTP 请求</text>
<text x="440" y="46" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">Authorization + Body</text>
<rect x="300" y="96" width="280" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="308" y="102" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
<text x="330" y="111" fill="#eb6c36" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">PRE</text>
<text x="440" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Pre Filter 过滤器链</text>
<text x="440" y="148" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">鉴权 → 限流 → 请求改写</text>
<text x="440" y="162" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">转发前执行 · 横切关注点</text>
<rect x="48" y="104" width="180" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="138" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">GlobalFilter</text>
<text x="138" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">全局生效 · AuthGlobalFilter</text>
<rect x="652" y="104" width="180" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="742" y="128" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">GatewayFilter</text>
<text x="742" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">路由级 · StripPrefix</text>
<rect x="310" y="212" width="260" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<rect x="318" y="218" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
<text x="348" y="227" fill="#2d3142" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
<text x="440" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Route 匹配 + 转发</text>
<text x="440" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">Predicate 断言 · lb:// 负载均衡</text>
<rect x="330" y="308" width="220" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<rect x="338" y="314" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
<text x="362" y="323" fill="#2d3142" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
<text x="440" y="340" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">目标业务服务</text>
<text x="440" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">mall-seckill / mall-order 等</text>
<rect x="300" y="404" width="280" height="76" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="308" y="410" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
<text x="334" y="419" fill="#eb6c36" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">POST</text>
<text x="440" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Post Filter 过滤器链</text>
<text x="440" y="456" fill="#eb6c36" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">响应日志 → 错误处理 → 响应改写</text>
<text x="440" y="470" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">收到响应后执行 · 逆序</text>
<rect x="368" y="520" width="144" height="40" rx="4" fill="#f5f5f5" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3"/>
<text x="440" y="536" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">HTTP 响应</text>
<text x="440" y="550" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">返回客户端</text>
<line x1="32" y1="572" x2="848" y2="572" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="32" y="588" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="120" y1="584" x2="152" y2="584" stroke="#eb6c36" stroke-width="1.2"/>
<text x="160" y="588" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">过滤器链（焦点）</text>
<line x1="280" y1="584" x2="312" y2="584" stroke="#2e5aa8" stroke-width="1.2"/>
<text x="320" y="588" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">请求/响应入口</text>
<line x1="440" y1="584" x2="472" y2="584" stroke="#4f5d75" stroke-width="1.2"/>
<text x="480" y="588" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">链路/组件</text>
<line x1="600" y1="584" x2="632" y2="584" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="640" y="588" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">可选/对照</text>
</svg>