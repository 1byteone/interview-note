name: Docs Quality Check

on:
  push:
    branches: [master]
    paths: ['2-learning/**', '3-ecosystem/**', 'ai-coding-guide/**', '.github/workflows/docs-quality.yml']
  pull_request:
    branches: [master]
    paths: ['2-learning/**', '3-ecosystem/**', 'ai-coding-guide/**']

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown files
        uses: avto-dev/markdown-lint@v1
        with:
          args: '2-learning/**/*.md 3-ecosystem/**/*.md ai-coding-guide/**/*.md'
          config: '.markdownlint.json'

  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --exclude-loopback false
            --no-progress
            --accept 200,301,302
            --exclude 'https?://(www\.)?(github\.com|bilibili\.com|csdn\.net|zhihu\.com|juejin\.cn)'
            --exclude 'https?://localhost.*'
            --exclude 'https?://127\..*'
            '2-learning/**/*.md' '3-ecosystem/**/*.md' 'ai-coding-guide/**/*.md'
          fail: false

  structure-check:
    name: Validate Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files per tech stack
        run: |
          echo "🔍 Checking tutorial structure..."
          MISSING=0

          STACKS=(
            "00-roadmap"
            "01-backend-development"
            "02-java"
            "03-spring-boot"
            "04-python"
            "05-fastapi"
            "06-mysql"
            "07-redis"
            "08-rocketmq"
            "09-elasticsearch"
            "10-docker"
            "11-linux"
            "12-infrastructure"
            "13-dev-tools"
            "14-langchain"
            "15-rag"
            "16-openai"
          )

          for stack in "${STACKS[@]}"; do
            DIR="2-learning/stacks/$stack"
            if [ ! -d "$DIR" ]; then
              echo "⚠️  Missing directory: $DIR"
              MISSING=$((MISSING + 1))
              continue
            fi
            echo "✅ $stack structure OK"
          done

          echo ""
          echo "Structure check complete"

  code-validation:
    name: Validate Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        if: matrix.language == 'python'
        run: |
          echo "🔍 Checking Python files..."
          find 2-learning -name "*.py" -type f 2>/dev/null | while read f; do
            if python -m py_compile "$f" 2>/dev/null; then
              echo "✅ $f"
            else
              echo "❌ $f"
            fi
          done
          echo "✅ Python syntax check complete"

  stats:
    name: Project Stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats
        run: |
          echo "📊 Project Stats"
          echo "========================"
          echo ""
          echo "Markdown files: $(find . -name '*.md' -not -path './.git/*' | wc -l)"
          echo "Python files:   $(find . -name '*.py' -not -path './.git/*' | wc -l)"
          echo "Java files:     $(find . -name '*.java' -not -path './.git/*' | wc -l)"
          echo "Shell scripts:  $(find . -name '*.sh' -not -path './.git/*' | wc -l)"
          echo "SQL files:      $(find . -name '*.sql' -not -path './.git/*' | wc -l)"
          echo "SVG diagrams:   $(find . -name '*.svg' -not -path './.git/*' | wc -l)"
          echo ""
          echo "Total files:    $(find . -type f -not -path './.git/*' | wc -l)"
          echo "Total lines:    $(find . -name '*.md' -not -path './.git/*' -exec cat {} + | wc -l)"
