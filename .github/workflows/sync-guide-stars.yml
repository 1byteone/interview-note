name: Sync Guide Stars

on:
  schedule:
    # 每周一 09:07 UTC+8 (01:07 UTC)
    - cron: '7 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-stars:
    name: Sync Stars Data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 _scripts/sync_stars.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3-ecosystem/guide_repos.json 3-ecosystem/repositories/*.md 3-ecosystem/ecosystem-index.md 3-ecosystem/assets/ecosystem-*.svg 3-ecosystem/data/landscape.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(3-ecosystem): sync stars data

            Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
            git push
          fi