<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 620" role="img" aria-labelledby="t11-title t11-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t11-title">Elasticsearch 倒排索引与写入流程</title>
<desc id="t11-desc">正向索引与倒排索引的对比，以及写入全流程：buffer→translog→refresh→segment→flush→merge 各阶段作用。</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');</style>
<marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="310" y="16" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="36" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">倒排索引 vs 正向索引</text>

<line x1="440" y1="56" x2="440" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="48" y="76" width="240" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="168" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">正向索引（MySQL）</text>
<text x="168" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">Doc → Term：id=1 → 水稻, 稻瘟病</text>
<text x="168" y="124" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">类似书籍目录 → 第几页</text>

<path d="M 288,104 H 320" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#b)"/>

<rect x="320" y="76" width="240" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="440" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">倒排索引（ES）</text>
<text x="440" y="112" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">Term → Doc：水稻 → [doc1, doc3, doc7]</text>
<text x="440" y="124" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">类似索引页 → 关键词在哪些页</text>

<path d="M 560,104 H 592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

