<text x="440" y="236" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Refresh（1s）</text>
<text x="440" y="252" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">Segment 可搜索</text>

