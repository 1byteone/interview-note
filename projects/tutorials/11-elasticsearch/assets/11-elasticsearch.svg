<text x="620" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">内存段</text>

<path d="M 680,240 H 712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="712" y="216" width="120" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="772" y="236" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Flush</text>
<text x="772" y="252" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">磁盘持久化</text>

<line x1="440" y1="264" x2="440" y2="284" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="284" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="304" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Merge（后台合并）</text>
<text x="440" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">小 Segment 合并 → 删除文档清理</text>

<line x1="32" y1="336" x2="848" y2="336" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<rect x="310" y="344" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
