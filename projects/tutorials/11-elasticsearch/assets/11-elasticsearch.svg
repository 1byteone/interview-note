<text x="712" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Term Dictionary</text>
<text x="712" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">词项字典 · FST 内存</text>
<text x="712" y="124" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">Posting List 倒排列表</text>

<line x1="32" y1="148" x2="848" y2="148" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<rect x="310" y="156" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">ES 写入全流程</text>

