<line x1="280" y1="480" x2="312" y2="480" stroke="#2e5aa8" stroke-width="1.2"/>
<text x="320" y="484" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace">数据源</text>
