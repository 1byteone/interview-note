<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 640" role="img" aria-labelledby="t08-title t08-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t08-title">RocketMQ 事务消息二阶段提交与回查机制</title>
<desc id="t08-desc">事务消息 5 步流程：发送半消息→Broker 确认→执行本地事务→提交/回滚→Broker 反查。以及秒杀异步链的多级队列。</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="310" y="16" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="36" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">RocketMQ 事务消息流程</text>

<line x1="440" y1="56" x2="440" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="80" width="260" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="318" y="86" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
<text x="340" y="95" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STEP1</text>
<text x="440" y="104" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">发送半消息（Half Message）</text>
<text x="440" y="116" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Producer → Broker（预处理，消费者不可见）</text>

<line x1="440" y1="120" x2="440" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="144" width="260" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="318" y="150" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
<text x="340" y="159" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STEP2</text>
<text x="440" y="168" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Broker 确认半消息</text>
<text x="440" y="180" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">返回半消息 ID</text>

<line x1="440" y1="184" x2="440" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="208" width="260" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="318" y="214" width="44" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
<text x="340" y="223" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STEP3</text>
<text x="440" y="232" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">执行本地事务</text>
<text x="440" y="244" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">本地 DB 操作 · 订单/库存写入</text>

<line x1="440" y1="248" x2="440" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="200" y="272" width="200" height="52" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
<text x="300" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">COMMIT 提交</text>
<text x="300" y="312" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">消费者可见 · 正常投递</text>

<rect x="480" y="272" width="200" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="580" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">ROLLBACK 回滚</text>
<text x="580" y="312" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">半消息删除 · 不投递</text>

<path d="M 440,248 V 260 H 300 V 272" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#d)"/>
<path d="M 440,248 V 260 H 580 V 272" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#b)"/>

<line x1="440" y1="324" x2="440" y2="352" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="352" width="260" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="318" y="358" width="72" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
<text x="354" y="367" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">STEP5</text>
<text x="440" y="376" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Broker 反查（Callback Check）</text>
<text x="440" y="392" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">超时未决 → 主动回调查询本地事务状态</text>
<text x="440" y="404" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">TransactionListener#checkLocalTransaction</text>

<line x1="32" y1="420" x2="848" y2="420" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<rect x="310" y="428" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="448" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">秒杀异步消息链</text>
<text x="440" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">多级 Topic 解耦</text>

<line x1="440" y1="468" x2="440" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="48" y="488" width="176" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="136" y="508" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">seckill_order</text>
<text x="136" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">订单创建</text>

<path d="M 224,512 H 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="260" y="488" width="176" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="348" y="508" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">seckill_pay</text>
<text x="348" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">支付确认</text>

<path d="M 436,512 H 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="472" y="488" width="176" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="560" y="508" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">seckill_stock</text>
<text x="560" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">库存扣减</text>

<path d="M 648,512 H 684" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="684" y="488" width="156" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="762" y="508" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">seckill_notify</text>
<text x="762" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">结果通知</text>

<line x1="32" y1="556" x2="848" y2="556" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<rect x="310" y="564" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="584" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">幂等消费保障</text>
<text x="440" y="598" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">Redis 分布式锁 + 去重表</text>
</svg>