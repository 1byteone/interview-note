<text x="440" y="480" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">每 10s 检查 · 续期至 30s</text>

<path d="M 564,470 H 592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="592" y="444" width="240" height="52" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
