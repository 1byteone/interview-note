<text x="160" y="592" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">缓存层（焦点）</text>
<line x1="280" y1="588" x2="312" y2="588" stroke="#2e5aa8" stroke-width="1.2"/>
<text x="320" y="592" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">异步层</text>
