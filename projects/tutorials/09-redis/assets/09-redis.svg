<text x="306" y="319" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">L3</text>
<text x="440" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">数据库乐观锁</text>
<text x="440" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">version 字段 CAS 更新</text>
<text x="440" y="360" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">最终一致性校验</text>

