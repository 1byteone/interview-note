<text x="712" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">unlock · Lua 脚本安全删除</text>

<line x1="440" y1="496" x2="440" y2="520" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="280" y="520" width="320" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="540" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Lua 脚本保证原子性</text>
<text x="440" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">KEYS[1] 库存键 · ARGV[1] 扣减数量</text>

