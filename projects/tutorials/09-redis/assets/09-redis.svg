<rect x="280" y="80" width="320" height="40" rx="4" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1"/>
<text x="440" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">用户请求 → Nginx 负载均衡</text>
<text x="440" y="114" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">限流 + 防刷</text>

