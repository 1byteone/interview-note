<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 600" role="img" aria-labelledby="t09-title t09-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t09-title">Redis 秒杀架构三层设计与分布式锁</title>
<desc id="t09-desc">三层秒杀架构：Redis 预扣库存→MQ 异步→数据库乐观锁。Redisson WatchDog 自动续期机制，Lua 脚本保证原子性。</desc>
<defs>
