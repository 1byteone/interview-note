<text x="56" y="664" fill="#2d3142" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="start">MATCH (c:Crop {name: '水稻'})&lt;-[:AFFECTS]-(d:Disease)&lt;-[:TREATS]-(chem:Chemical) RETURN d.name, chem.name</text>

