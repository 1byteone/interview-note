<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 620" role="img" aria-labelledby="t12-title t12-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t12-title">Docker 多阶段构建与 Compose 部署</title>
<desc id="t12-desc">多阶段构建流程：Maven builder 编译→JRE runtime 运行，镜像从 400MB 优化到 150MB。docker-compose 编排 5 服务及三环境部署策略。</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');</style>
<marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="310" y="16" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="36" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Docker 多阶段构建</text>

<line x1="440" y1="56" x2="440" y2="76" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="48" y="76" width="240" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="168" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Stage 1：Builder</text>
<text x="168" y="112" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">maven:3.9-eclipse-temurin-17</text>
<text x="168" y="128" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">mvn clean package -DskipTests</text>
<text x="168" y="140" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">打包 JAR 约 400MB</text>

<path d="M 288,112 H 320" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#b)"/>
<text x="304" y="106" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">COPY --from</text>

<rect x="320" y="76" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="440" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Stage 2：Runtime</text>
<text x="440" y="112" fill="#eb6c36" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">eclipse-temurin:17-jre</text>
<text x="440" y="128" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">仅 JRE 无 JDK</text>
<text x="440" y="140" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">最终镜像约 150MB</text>

<path d="M 560,112 H 592" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="592" y="76" width="240" height="72" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
<text x="712" y="96" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">优化效果</text>
<text x="712" y="112" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">400MB → 150MB</text>
<text x="712" y="128" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">-62.5% 体积缩减</text>
<text x="712" y="140" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">部署更快更安全</text>

