<text x="168" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">.dockerignore</text>
<text x="168" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">排除 target .git node_modules</text>

<rect x="320" y="524" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="440" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">分层缓存</text>
<text x="440" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">依赖先 COPY · 源码后 COPY</text>

<rect x="592" y="524" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
