<text x="712" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">docker-compose -f prod.yml</text>
<text x="712" y="420" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">多副本 · 资源限制</text>

