<rect x="280" y="308" width="320" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="328" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">三环境部署策略</text>

<line x1="440" y1="348" x2="440" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="48" y="368" width="240" height="72" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
