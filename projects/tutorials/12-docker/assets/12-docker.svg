<text x="642" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">8083 · 用户服务</text>

<rect x="736" y="232" width="108" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="790" y="252" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">Nacos</text>
<text x="790" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">8848 · 注册中心</text>

