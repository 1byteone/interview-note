<text x="168" y="404" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">docker-compose -f dev.yml</text>
<text x="168" y="420" fill="#7a8399" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">源码挂载 · 热重载</text>

