<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 640" role="img" aria-labelledby="t06-title t06-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t06-title">Sentinel 熔断降级状态机与策略</title>
<desc id="t06-desc">CLOSED→OPEN→HALF_OPEN 熔断器状态机，三种熔断策略（慢调用比例/异常比例/异常数），Nacos 规则持久化。</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="310" y="16" width="260" height="56" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
<text x="440" y="36" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">熔断器状态机</text>
<text x="440" y="52" fill="#2e5aa8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Circuit Breaker 三态转换</text>
<text x="440" y="64" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">@SentinelResource 注解驱动</text>

<line x1="440" y1="72" x2="440" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="290" y="112" width="300" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<rect x="298" y="118" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
<text x="326" y="127" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">CLOSED</text>
<text x="440" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">CLOSED（关闭状态）</text>
<text x="440" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">正常请求放行 · 统计窗口内监控指标</text>

<path d="M 590,140 H 650" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#b)"/>
<text x="626" y="134" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">阈值触发</text>

<rect x="650" y="112" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="750" y="136" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">OPEN（开启状态）</text>
<text x="750" y="152" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">直接拒绝 · 快速失败返回</text>

<path d="M 750,168 V 200 H 440 V 220" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#d)"/>
<text x="600" y="196" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">熔断时间到 · 放行探测请求</text>

<rect x="290" y="220" width="300" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<rect x="298" y="226" width="84" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
<text x="340" y="235" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">HALF_OPEN</text>
<text x="440" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">HALF_OPEN（半开状态）</text>
<text x="440" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">放行探测请求 · 评估服务健康</text>

<path d="M 440,276 V 300 H 320 V 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>
<text x="380" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">成功 → CLOSED</text>

<path d="M 440,276 V 300 H 560 V 312" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#b)"/>
<text x="506" y="296" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">失败 → OPEN</text>

<line x1="32" y1="296" x2="848" y2="296" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<rect x="310" y="316" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="340" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">三种熔断策略</text>

<line x1="440" y1="356" x2="440" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="48" y="380" width="240" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="168" y="404" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">慢调用比例</text>
<text x="168" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">RT > 阈值 的请求比例</text>
<text x="168" y="436" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">maxRt=500ms · ratio=0.5</text>

<rect x="320" y="380" width="240" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="440" y="404" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">异常比例</text>
<text x="440" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">异常占请求数的比例</text>
<text x="440" y="436" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">minRequest=5 · ratio=0.2</text>

<rect x="592" y="380" width="240" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="712" y="404" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">异常数</text>
<text x="712" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">时间窗口内发生异常数</text>
<text x="712" y="436" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">minRequest=5 · count=3</text>

<line x1="440" y1="452" x2="440" y2="480" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="480" width="260" height="56" rx="6" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
<rect x="318" y="486" width="52" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.5)" stroke-width="0.8"/>
<text x="344" y="495" fill="#2e5aa8" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">PERSIST</text>
<text x="440" y="512" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Nacos 规则持久化</text>
<text x="440" y="528" fill="#2e5aa8" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">NacosDataSource 实时同步</text>

<line x1="440" y1="536" x2="440" y2="564" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="564" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">应用服务</text>
<text x="440" y="600" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">@SentinelResource blockHandler</text>

<line x1="32" y1="616" x2="848" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="32" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">LEGEND</text>
<line x1="120" y1="628" x2="152" y2="628" stroke="#eb6c36" stroke-width="1.2"/>
<text x="160" y="632" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">熔断触发</text>
<line x1="280" y1="628" x2="312" y2="628" stroke="#2e5aa8" stroke-width="1.2"/>
<text x="320" y="632" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">持久化/恢复</text>
<line x1="440" y1="628" x2="472" y2="628" stroke="#4f5d75" stroke-width="1.2"/>
<text x="480" y="632" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">状态转换</text>
<line x1="600" y1="628" x2="632" y2="628" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="640" y="632" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace">策略对照</text>
</svg>