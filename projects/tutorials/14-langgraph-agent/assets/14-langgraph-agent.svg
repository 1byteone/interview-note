<rect x="48" y="524" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="168" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">query_crop_knowledge</text>
<text x="168" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">作物知识检索 · crop_name, topic</text>

<rect x="320" y="524" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="440" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">get_current_datetime</text>
<text x="440" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">获取当前时间 · 无参数</text>

<rect x="592" y="524" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="712" y="544" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">calculate_growing_period</text>
<text x="712" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">生育期计算 · crop, region, sowing</text>

<line x1="32" y1="588" x2="848" y2="588" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<rect x="48" y="596" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="168" y="616" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">get_agri_weather</text>
<text x="168" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">农业气象 · location, date</text>

<rect x="320" y="596" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="440" y="616" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">fetch_web_content</text>
<text x="440" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">网页抓取 · url</text>

<rect x="592" y="596" width="240" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<text x="712" y="616" fill="#2d3142" font-size="10" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">search_agri_resources</text>
<text x="712" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">图片/资料搜索 · query</text>
