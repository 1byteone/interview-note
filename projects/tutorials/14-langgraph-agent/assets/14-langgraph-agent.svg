<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 680" role="img" aria-labelledby="t14-title t14-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t14-title">LangGraph ReAct Agent Loop</title>
<desc id="t14-desc">ReAct Agent 循环：Thought→Action→Observation 循环，6 个工具调用，StateGraph 状态管理。</desc>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="b" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="d" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="310" y="16" width="260" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="36" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">LangGraph ReAct Agent Loop</text>

<line x1="440" y1="56" x2="440" y2="80" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="80" width="260" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="440" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">用户输入</text>
<text x="440" y="114" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">CropWise 农业问答请求</text>

<line x1="440" y1="120" x2="440" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="144" width="260" height="40" rx="4" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
<rect x="318" y="150" width="62" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.5)" stroke-width="0.8"/>
<text x="349" y="159" fill="#2e5aa8" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">THOUGHT</text>
<text x="440" y="168" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Thought（推理）</text>
<text x="440" y="182" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">LLM 分析问题 · 决定下一步</text>

<line x1="440" y1="184" x2="440" y2="208" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="208" width="260" height="40" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<rect x="318" y="214" width="62" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
<text x="349" y="223" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ACTION</text>
<text x="440" y="232" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Action（调用工具）</text>
<text x="440" y="246" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">选择并调用工具函数</text>

<line x1="440" y1="248" x2="440" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="272" width="260" height="40" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.3)" stroke-width="1"/>
<rect x="318" y="278" width="62" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
<text x="349" y="287" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">OBSERVE</text>
<text x="440" y="296" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Observation（观察）</text>
<text x="440" y="310" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">获取工具返回结果</text>

<path d="M 440,312 V 328 C 440 336, 440 336, 432 336 H 168 C 160 336, 160 336, 160 328 V 312" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#b)"/>
<text x="300" y="348" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">未完成 → 继续循环</text>

<line x1="440" y1="312" x2="440" y2="400" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="310" y="400" width="260" height="40" rx="4" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1.2"/>
<rect x="318" y="406" width="62" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.5)" stroke-width="0.8"/>
<text x="349" y="415" fill="#2e5aa8" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing="0.08em">ANSWER</text>
<text x="440" y="424" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Final Answer（最终回答）</text>
<text x="440" y="438" fill="#7a8399" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">生成最终答案返回给用户</text>

<line x1="32" y1="456" x2="848" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<rect x="280" y="464" width="320" height="40" rx="4" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="484" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">CropWise 6 工具集</text>

