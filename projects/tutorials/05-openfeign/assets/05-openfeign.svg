<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 660" role="img" aria-labelledby="t05-title t05-desc" xmlns="http://www.w3.org/2000/svg">
<title id="t05-title">OpenFeign 声明式 HTTP 客户端调用流程</title>
<desc id="t05-desc">@FeignClient 接口通过 JDK 动态代理生成代理对象，InvocationHandler 拦截方法调用构建 HTTP 请求，经 LoadBalancer 选取实例，最终由 HttpClient 执行远程调用。</desc>
