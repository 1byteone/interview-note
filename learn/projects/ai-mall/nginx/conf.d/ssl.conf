# =============================================================================
# AI Mall - HTTPS 服务器配置片段
# 在 nginx.conf 的 http 块中通过 include 引入此文件即可启用 HTTPS
# 前提：将证书文件放入 nginx/ssl/ 目录
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 证书配置（请替换为实际证书）
    ssl_certificate     /etc/nginx/ssl/ai-mall.crt;
    ssl_certificate_key /etc/nginx/ssl/ai-mall.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS（生产环境启用）
    # add_header Strict-Transport-Security "max-age=63072000" always;

    charset utf-8;
    root  /usr/share/nginx/html;

    # 复用主服务器的 location 配置（通过 include 或直接复制）
    location /api/ {
        proxy_pass http://mall_gateway_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}