# =============================================================================
# Grafana 数据源自动配置 — Prometheus
# 挂载路径: /etc/grafana/provisioning/datasources/datasources.yml
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      queryTimeout: 30s
      httpMethod: POST