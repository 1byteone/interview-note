version: '3.8'

services:
  # Redis Stack（包含 Redis + RedisJSON + RedisSearch + RedisTimeSeries）
  redis:
    image: redis/redis-stack-server:7.2.0-v6
    container_name: redis-quickstart
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # RedisInsight（可视化管理工具）
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis

volumes:
  redis_data:
  redisinsight_data: