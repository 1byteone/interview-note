<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <title>LangChain Agent 工作流程</title>
  <desc>LangChain Agent architecture: user input to LLM, tool selection, execution, reasoning loop, and final output.</desc>
  <defs>
    <marker id="arrowLC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/></marker>
    <marker id="arrowLCTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#10A37F"/></marker>
    <marker id="arrowLCMain" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2DD4BF"/></marker>
    <linearGradient id="bgLC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#12121f"/>
    </linearGradient>
  </defs>
  <rect width="960" height="760" rx="18" fill="url(#bgLC)"/>
  <text x="480" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">LangChain Agent 工作流程</text>
  <text x="480" y="80" text-anchor="middle" font-size="14" fill="#94A3B8">LLM 作为"大脑"选择并调用工具，循环推理直到得到最终答案</text>

  <!-- ===== 主流程（横向） ===== -->
  <!-- 用户输入 -->
  <rect x="40" y="140" width="130" height="90" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <path d="M105,152 L105,170 L185,170 L185,152 M105,152 L105,170 M105,170 L135,170" stroke="#FBBF24" stroke-width="1" fill="none"/>
  <text x="105" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#FDE68A">用户输入</text>
  <text x="105" y="220" text-anchor="middle" font-size="10" fill="#FEF3C7">User Input</text>

  <path d="M170,185 L237,185" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arrowLCMain)"/>

  <!-- Agent LLM -->
  <rect x="242" y="115" width="170" height="140" rx="16" fill="#0F766E" stroke="#10A37F" stroke-width="2.5"/>
  <text x="327" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#CCFBF1">Agent (LLM)</text>
  <text x="327" y="172" text-anchor="middle" font-size="11" fill="#99F6E4">大模型推理 · ReAct</text>
  <text x="327" y="192" text-anchor="middle" font-size="11" fill="#99F6E4">(思考 → 行动 → 观察)</text>
  <rect x="262" y="205" width="130" height="32" rx="8" fill="#115E59"/>
  <text x="327" y="226" text-anchor="middle" font-size="12" fill="#5EEAD4">选择工具 or 直接回答</text>

  <path d="M412,185 L479,185" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arrowLCMain)"/>

  <!-- 工具选择 -->
  <rect x="484" y="140" width="130" height="90" rx="14" fill="#274B8A" stroke="#3B82F6" stroke-width="2"/>
  <text x="549" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#93C5FD">工具选择</text>
  <text x="549" y="200" text-anchor="middle" font-size="10" fill="#BFDBFE">Tool Selection</text>
  <text x="549" y="220" text-anchor="middle" font-size="10" fill="#BFDBFE">解析函数调用参数</text>

  <path d="M614,185 L681,185" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arrowLCMain)"/>

  <!-- 执行工具 -->
  <rect x="686" y="140" width="130" height="90" rx="14" fill="#1E3A8A" stroke="#6366F1" stroke-width="2"/>
  <text x="751" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#A5B4FC">执行工具</text>
  <text x="751" y="200" text-anchor="middle" font-size="10" fill="#C7D2FE">Execute Tool</text>
  <text x="751" y="220" text-anchor="middle" font-size="10" fill="#C7D2FE">返回结构化结果</text>

  <!-- 结果回到 Agent -->
  <path d="M751,230 L751,300 L327,300 L327,257" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowLC)"/>
  <rect x="520" y="282" width="70" height="22" rx="11" fill="#334155"/>
  <text x="555" y="298" text-anchor="middle" font-size="10" fill="#CBD5E1">观察结果</text>

  <!-- ===== 循环标注 ===== -->
  <rect x="330" y="320" width="280" height="34" rx="17" fill="#0F766E" opacity="0.25" stroke="#10A37F" stroke-width="1.5"/>
  <text x="470" y="342" text-anchor="middle" font-size="12" fill="#5EEAD4" font-weight="bold">循环推理：若答案不满意则继续调用工具（多步推理）</text>

  <!-- ===== 工具面板 ===== -->
  <rect x="40" y="380" width="880" height="240" rx="14" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="412" text-anchor="middle" font-size="16" font-weight="bold" fill="#E2E8F0">工具集（Tools）</text>
  <line x1="65" y1="424" x2="895" y2="424" stroke="#475569" stroke-width="1"/>

  <!-- 搜索 -->
  <rect x="60" y="440" width="200" height="120" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="160" cy="470" r="16" fill="#38BDF8" opacity="0.2"/>
  <path d="M155,463 L160,468 L170,458" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#7DD3FC">搜索引擎</text>
  <text x="160" y="528" text-anchor="middle" font-size="11" fill="#94A3B8">Web Search</text>
  <text x="160" y="546" text-anchor="middle" font-size="11" fill="#64748B">Agent 联网查询实时信息</text>

  <!-- 计算器 -->
  <rect x="280" y="440" width="200" height="120" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="380" y="478" text-anchor="middle" font-size="16" fill="#FBBF24">∑ =</text>
  <text x="380" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#FDE68A">计算器</text>
  <text x="380" y="528" text-anchor="middle" font-size="11" fill="#94A3B8">Calculator</text>
  <text x="380" y="546" text-anchor="middle" font-size="11" fill="#64748B">精确数学运算，避免 LLM 幻觉</text>

  <!-- 数据库 -->
  <rect x="500" y="440" width="200" height="120" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <ellipse cx="600" cy="460" rx="14" ry="6" fill="none" stroke="#34D399" stroke-width="2"/>
  <path d="M586,460 L586,475 M586,467 Q586,473 600,473 M600,473 Q614,473 614,467 M614,460 L614,475" stroke="#34D399" stroke-width="2" fill="none"/>
  <text x="600" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#6EE7B7">数据库查询</text>
  <text x="600" y="528" text-anchor="middle" font-size="11" fill="#94A3B8">SQL Database</text>
  <text x="600" y="546" text-anchor="middle" font-size="11" fill="#64748B">NL2SQL · 查询业务数据</text>

  <!-- API -->
  <rect x="720" y="440" width="200" height="120" rx="12" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
  <rect x="805" y="460" width="18" height="18" rx="4" stroke="#C084FC" stroke-width="2" fill="none"/>
  <path d="M812,464 L812,474 M809,469 L815,469" stroke="#C084FC" stroke-width="2"/>
  <text x="820" y="508" text-anchor="middle" font-size="14" font-weight="bold" fill="#D8B4FE">外部 API</text>
  <text x="820" y="528" text-anchor="middle" font-size="11" fill="#94A3B8">REST / OpenAPI</text>
  <text x="820" y="546" text-anchor="middle" font-size="11" fill="#64748B">天气 · 支付 · 企业系统对接</text>

  <!-- ===== 最终输出 ===== -->
  <text x="480" y="660" text-anchor="middle" font-size="14" fill="#94A3B8">↓ LLM 综合所有观察结果生成回答</text>
  <path d="M480,672 L480,690" stroke="#2DD4BF" stroke-width="2.5" marker-end="url(#arrowLCMain)"/>

  <rect x="330" y="696" width="300" height="52" rx="26" fill="#0F766E" stroke="#2DD4BF" stroke-width="2.5"/>
  <text x="480" y="722" text-anchor="middle" font-size="16" font-weight="bold" fill="#CCFBF1">最终输出（Final Answer）</text>
  <text x="480" y="741" text-anchor="middle" font-size="10" fill="#5EEAD4">完整、准确、可解释的自然语言回答</text>
</svg>