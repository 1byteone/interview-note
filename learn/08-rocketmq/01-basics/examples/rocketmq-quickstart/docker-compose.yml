version: '3.8'

services:
  # -------- NameServer：管理 Broker 路由信息 --------
  namesrv:
    image: apache/rocketmq:5.2.0
    container_name: rmq-namesrv
    entrypoint: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "9876:9876"
    networks:
      - rocketmq_net

  # -------- Broker：消息存储和处理 --------
  broker:
    image: apache/rocketmq:5.2.0
    container_name: rmq-broker
    entrypoint: sh mqbroker
    depends_on:
      - namesrv
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "10911:10911"   # 客户端通信端口
      - "10909:10909"   # 内部通信端口
      - "10912:10912"   # VIP 端口
    volumes:
      - broker_data:/home/rocketmq/store
      - broker_logs:/home/rocketmq/logs
      - ./broker.conf:/etc/rocketmq/broker.conf:ro
    networks:
      - rocketmq_net

  # -------- RocketMQ Dashboard（控制台）--------
  console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmq-console
    depends_on:
      - namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    ports:
      - "8080:8080"
    networks:
      - rocketmq_net

volumes:
  broker_data:
  broker_logs:

networks:
  rocketmq_net:
    driver: bridge